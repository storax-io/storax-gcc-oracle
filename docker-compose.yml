name: storax-gxx-oracle
# Runs on the compile host — compile jobs are pure CPU, so colocate with cores.
services:
  oracle:
    build: .
    image: storax-gxx-oracle
    container_name: storax-gxx-oracle
    ports:
      - "8950:8950"
    volumes:
      # every exec spawns a FRESH sibling container; the binary streams in
      # over stdin (no shared volumes), async job_id is the caller's pointer
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      # every job compiles here; nothing in the container touches disk
      - /dev/shm:size=1g,exec
    mem_limit: 4g
    restart: unless-stopped
